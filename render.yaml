# Render Blueprint: API, worker, and Redis.
# The database is NOT on Render: it is a Tiger Cloud service.
#
# Secrets are `sync: false`: Render asks for them when you create the Blueprint.
#   API:    DATABASE_URL, DEMO_ACCESS_CODE, CORS_ORIGINS, NVIDIA_API_KEY
#   Worker: DATABASE_URL, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM, PARENT_PHONE
#
# The worker runs the fake CGM and the rules, so it must be a paid always-on
# instance (free instances don't run background workers). Pick the Render region
# closest to the Tiger Cloud service (oregon <-> us-west-2, virginia <-> us-east-1).

envVarGroups:
  - name: sugarscout-shared
    envVars:
      - key: ENV
        value: staging
      - key: DB_SSL_MODE
        value: require
      - key: LOG_JSON
        value: "true"
      - key: DEMO_CHILD_NAME
        value: Alex
      - key: NEMOTRON_CHAT_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NEMOTRON_ANALYSIS_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b

services:
  - type: web
    name: sugarscout-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    preDeployCommand: alembic upgrade head
    dockerCommand: sh -c 'uvicorn sugarscout.api.main:app --host 0.0.0.0 --port ${PORT:-10000} --proxy-headers --forwarded-allow-ips="*"'
    envVars:
      - fromGroup: sugarscout-shared
      - key: SERVICE_NAME
        value: api
      - key: DB_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://sugarscout.vercel.app
      - key: NVIDIA_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sugarscout-redis
          property: connectionString

  - type: worker
    name: sugarscout-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    dockerCommand: arq sugarscout.worker.main.WorkerSettings
    envVars:
      - fromGroup: sugarscout-shared
      - key: SERVICE_NAME
        value: worker
      - key: DB_POOL_SIZE
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false # your Twilio trial number, +1XXXXXXXXXX
      - key: PARENT_PHONE
        sync: false # your verified phone, +1XXXXXXXXXX
      - key: TWILIO_TRIAL_TEMPLATE
        value: sms_account_alerts # trial accounts can't send custom text; clear after upgrading
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sugarscout-redis
          property: connectionString

  - type: keyvalue
    name: sugarscout-redis
    plan: free # fine for a demo: sim state and job queue can be lost on restart
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # only reachable from Render services in this account
